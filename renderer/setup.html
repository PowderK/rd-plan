<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>RD-Plan – Ersteinrichtung</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    .row { display: flex; gap: 8px; align-items: center; }
    input[type="text"] { width: 480px; padding: 6px; }
    button { padding: 6px 10px; }
    .hint { color: #555; font-size: 12px; margin-top: 8px; }
    .ok { color: #0a7f2e; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Ersteinrichtung</h1>
  <p>Bitte wählen Sie den Speicherort für die Datenbank (z. B. Netzlaufwerk). Sie können dies später in den Einstellungen ändern.</p>

  <div class="row">
    <input id="dir" type="text" placeholder="\\\\SERVER\\Freigabe\\RD-Plan\\DB oder Y:\\RD-Plan\\DB" />
    <button id="choose">Ordner wählen…</button>
    <button id="test">Prüfen</button>
  </div>
  <div id="defaults" class="hint"></div>
  <div id="status" class="hint"></div>

  <div style="margin-top:16px">
    <button id="save" disabled>Übernehmen und neu starten</button>
  </div>
  <script type="module" src="./setup.js"></script>
</body>
</html>
