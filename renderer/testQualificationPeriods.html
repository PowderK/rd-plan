<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Qualification Periods Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        pre {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Qualification Periods API Test</h1>
    <p>Diese Seite testet die neu implementierte Qualification Periods API.</p>
    
    <button onclick="runTest()">Test ausführen</button>
    
    <div id="results"></div>

    <script>
        async function runTest() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Test läuft...</p>';
            
            try {
                const result = await window.api.testQualificationPeriods();
                
                if (result.success) {
                    let html = '<div class="result success">';
                    html += '<h3>✅ Test erfolgreich!</h3>';
                    html += '<ul>';
                    result.results.forEach(r => {
                        html += `<li>${r}</li>`;
                    });
                    html += '</ul>';
                    html += '</div>';
                    resultsDiv.innerHTML = html;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ Test fehlgeschlagen!</h3>
                            <p><strong>Fehler:</strong> ${result.message}</p>
                            ${result.stack ? `<pre>${result.stack}</pre>` : ''}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Unerwarteter Fehler!</h3>
                        <p><strong>Fehler:</strong> ${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }
        
        // Auto-run test on page load
        window.addEventListener('DOMContentLoaded', runTest);
    </script>
</body>
</html>
