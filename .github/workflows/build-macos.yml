name: build-macos

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          # Intel (x64)
          - runner: macos-13
            arch: x64
          # Apple Silicon (arm64)
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      DEBUG: 'electron-builder'
      npm_config_runtime: 'electron'
      npm_config_target: '28.3.3'
      npm_config_disturl: 'https://electronjs.org/headers'
      npm_config_build_from_source: 'true'
      # Verhindert Codesigning-/Notarization-Fehler bei CI-Builds
      CSC_IDENTITY_AUTO: 'false'
      APPLE_NOTARIZE: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (with retry)
        shell: bash
        run: |
          set -e
          npm cache clean --force || true
          rm -rf node_modules package-lock.json 2>/dev/null || true
          for i in {1..3}; do
            echo "npm ci attempt $i"
            npm ci --include=dev --fetch-timeout=600000 --cache-max=0 --prefer-offline --no-audit --progress=false && break || {
              echo "npm ci failed, retrying in 5s..."; sleep 5;
            }
          done
          
      - name: Verify TypeScript installation
        shell: bash
        run: |
          echo "Checking TypeScript..."
          npx tsc --version || {
            echo "TypeScript not found, installing...";
            npm install --save-dev typescript;
          }

      - name: Prefetch Electron headers for node-gyp (with retry)
        shell: bash
        run: |
          for i in {1..3}; do
            npx node-gyp install --target=28.3.3 --dist-url=https://electronjs.org/headers && break || sleep 5;
          done

      - name: Rebuild native deps for Electron (better-sqlite3)
        shell: bash
        run: |
          for i in {1..3}; do
            npx electron-rebuild -f -w better-sqlite3 --version=28.3.3 && break || sleep 5;
          done

      - name: Clean dist folder
        shell: bash
        run: node -e "require('fs').rmSync('dist',{recursive:true,force:true})"

      - name: Debug build environment
        shell: bash
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "TypeScript version: $(npx tsc --version || echo 'TypeScript not found')"
          echo "Vite version: $(npx vite --version || echo 'Vite not found')"
          echo "Current directory: $(pwd)"
          echo "Available scripts:"; cat package.json | grep -A 10 "scripts" || true

      - name: Build (TypeScript main)
        run: npm run build:main

      - name: Build (Vite renderer)
        run: npm run build:renderer

      - name: Package macOS app (unsigned)
        # Default mac target ist dmg/zip; baue anhand der Matrix-Architektur
        run: npx electron-builder --mac --${{ matrix.arch }}

      - name: Upload artifacts (tags oder manuell)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rd-plan-macos-${{ matrix.arch }}-${{ github.ref_name || github.sha }}
          path: |
            dist/*.dmg
            dist/*mac*.zip
            dist/*.yml
          retention-days: 30

      - name: Create GitHub Release (pre-release) and upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*mac*.zip
            dist/*.yml