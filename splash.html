<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RD-Plan wird geladen...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .logo-container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      margin-bottom: 40px;
    }

    .logo {
      width: 200px;
      height: 200px;
      object-fit: contain;
      transition: opacity 0.5s ease-in-out;
    }
    
    .logo.fade-out {
      opacity: 0;
    }

    .loading-text {
      color: white;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 20px;
      animation: pulse 1.5s ease-in-out infinite;
      min-height: 27px; /* Verhindert Springen */
      text-align: center;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }
    
    .loading-details {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
      min-height: 21px; /* Verhindert Springen */
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .version {
      position: absolute;
      bottom: 20px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
    }


  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-container">
      <img src="media/RD-Plan Logo.gif" alt="RD-Plan Logo" class="logo">
    </div>
    <div class="loading-text" id="loading-text">RD-Plan wird geladen...</div>
    <div class="loading-details" id="loading-details"></div>
    <div class="spinner"></div>
  </div>
  <div class="version">Version 1.0.2 RC</div>
  
  <script>
    // Status-Updates empfangen
    if (window.electronAPI && window.electronAPI.on) {
      window.electronAPI.on('splash-status', (data) => {
        const loadingText = document.getElementById('loading-text');
        const loadingDetails = document.getElementById('loading-details');
        
        if (loadingText && data.message) {
          loadingText.textContent = data.message;
        }
        if (loadingDetails && data.details) {
          loadingDetails.textContent = data.details;
        }
      });
    }

    // Wechsle nach 5.29 Sekunden vom animierten GIF zum statischen Bild
    setTimeout(() => {
      const logo = document.querySelector('.logo');
      if (logo) {
        // Fade out
        logo.classList.add('fade-out');
        
        // Nach Fade-out: Bild wechseln
        setTimeout(() => {
          logo.src = 'media/Timeline 1_01_00_05_29.png';
          logo.classList.remove('fade-out');
        }, 500);
      }
    }, 5290);
  </script>
</body>
</html>
